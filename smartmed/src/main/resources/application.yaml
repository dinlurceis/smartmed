spring:
  application:
    name: smartmed
  datasource:
    url: jdbc:mysql://localhost:3306/smartmed
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  thymeleaf:
    encoding: UTF-8
    servlet:
      encoding:
        charset: UTF-8
        force: true
    messages:
      encoding: UTF-8


server:
  port: 8080

jwt:
  signerKey: ${JWT_SIGNER_KEY}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-southeast-1
    bucket:
      name: "dinlurceis-smartmed"