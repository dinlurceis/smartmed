<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Danh sách thuốc</h2>
        <div class="search-box">
            <form class="form-inline">
                <div class="input-group">
                    <input class="form-control" type="search" placeholder="Tìm kiếm thuốc..." aria-label="Search">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-md-3 mb-4" th:each="medicine : ${medicines}">
            <div class="card medicine-card h-100">
                <div class="medicine-image">
                    <img th:if="${medicine.imageUrl}" th:src="${medicine.imageUrl}" class="card-img-top" alt="Medicine Image">
                    <div class="medicine-overlay">
                        <a th:href="@{'/medicines/' + ${medicine.id}}" class="btn btn-light btn-sm">
                            <i class="fas fa-eye"></i> Xem chi tiết
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${medicine.name}">Tên thuốc</h5>
                    <p class="card-text description" th:text="${medicine.description}">Mô tả ngắn về thuốc...</p>
                    <div class="medicine-price">
                        <span class="price-label">Giá:</span>
                        <span class="price-value" th:text="${#numbers.formatDecimal(medicine.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                    </div>
                    <div class="medicine-status">
                            <span class="badge" th:classappend="${medicine.available ? 'badge-success' : 'badge-danger'}"
                                  th:text="${medicine.available ? 'Còn hàng' : 'Hết hàng'}">
                            </span>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <button th:if="${medicine.available}" class="btn btn-primary btn-block add-to-cart"
                            th:onclick="'addToCart(' + ${medicine.id} + ')'">
                        <i class="fas fa-cart-plus"></i> Thêm vào giỏ
                    </button>
                    <button th:unless="${medicine.available}" class="btn btn-secondary btn-block" disabled>
                        Hết hàng
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation" th:if="${medicines.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${medicines.first ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/medicines(page=${medicines.number - 1})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, medicines.totalPages - 1)}"
                th:classappend="${medicines.number == i ? 'active' : ''}">
                <a class="page-link" th:href="@{/medicines(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${medicines.last ? 'disabled' : ''}">
                <a class="page-link" th:href="@{/medicines(page=${medicines.number + 1})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<th:block th:replace="fragments/footer :: scripts"/>
</body>
</html>
