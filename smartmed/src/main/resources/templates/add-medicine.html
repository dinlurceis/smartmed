<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Info</title>
    <link rel="icon" type="image/x-icon" href="/images/logo-edited.png">
    <link href='https://fonts.googleapis.com/css?family=Kumbh Sans' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Inria Sans' rel='stylesheet'>   
    <link href='https://fonts.googleapis.com/css?family=Lexend Peta:400,900' rel='stylesheet'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="/src/main/resources/static/css/menu-admin.css">
    <style>
        .title-box {
            height: 100px;
            margin-left: 250px;
        }
        .title-box h1 {
            font-family: 'Lexend Peta', sans-serif;
            padding-left: 30px;
            padding-top: 20px;
            font-weight: 700;
            display: inline-block;
        }
        .noti {
            color: black;
            font-size: 20px;
            float: right;
            margin-top: 50px;
            cursor: pointer;
        }
        .sign-out {
            margin: 53px 80px 0 30px;
            float: right;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }
        .form-box {
            margin: 50px 0 0 290px;
            display: flex;
        }
        .form-box-left {
            width: 50%;
            flex: 1;
        }
        .form-box-right {
            flex: 1;
        }
        .img-box {
            width: 80%;
            height: 300px;
            border: 1px dotted black;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            width: 150px;
            font-weight: bold;
            margin-right: 10px;
        }

        .form-group input, select {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 400px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #66afe9;
            outline: none;
        }

        .btn-submit {
            margin: 10px 0 0 20px;
            padding: 10px 20px;
            background-color: #66afe9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #0060ae;
        }
    </style>
</head>
<body>
<!-- Menu -->
<div class="menu">
    <img src="/src/main/resources/static/images/logo-edited.png" alt="Logo" style="width: 100px;">
    <h2>SMARTMED</h2>
    <div class="line-break"></div>
    <a href="#dashboard"><i class="glyphicon glyphicon-home"></i>&nbsp;&nbsp; Dash board</a>
    <a href="admin-user-info.html"><i class="glyphicon glyphicon-pencil"></i>&nbsp;&nbsp; User Info</a>
    <a href="admin-disease-info.html"><i class="glyphicon glyphicon-pencil"></i>&nbsp;&nbsp; Disease Info</a>
    <a href="admin-medicine-info.html"><i class="glyphicon glyphicon-pencil"></i>&nbsp;&nbsp; Medicine Info</a>
    <a href="#admin-settings"><i class="glyphicon glyphicon-cog"></i>&nbsp;&nbsp; Settings</a>
    <div class="footer"><p>&copy; 2025 SmartMed.</p></div>
</div>
<div class="title-box">
    <h1>ADD NEW MEDICINE</h1>
    <div class="sign-out">SIGN OUT</div>
    <div class="noti">
        <i class="glyphicon glyphicon-envelope"></i>
    </div>
</div>

<div class="form-box">
    <div class="form-box-left">
        <div class="form-group">
            <label for="id">ID:</label>
            <input type="text" id="id" placeholder="Enter ID">
        </div>
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter Name">
        </div>
        <div class="form-group">
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" placeholder="Enter Category">
        </div>
        <div class="form-group">
            <label for="dosageForm">Dosage Form:</label>
            <select id="dosageForm" name="dosageForm">
                <option value="Tablet">Tablet</option>
                <option value="Cream">Cream</option>
                <option value="Injection">Injection</option>
                <option value="Syrup">Syrup</option>
                <option value="Ointment">Ointment</option>
                <option value="Inhaler">Inhaler</option>
                <option value="Capsule">Capsule</option>
            </select>
        </div>
        <div class="form-group">
            <label for="strength">Strength:</label>
            <input type="text" id="strength" name="strength" placeholder="Enter Strength">
        </div>
        <div class="form-group">
            <label for="manufacturer">Manufacturer:</label>
            <input type="text" id="manufacturer" name="manufacturer" placeholder="Enter Manufacturer">
        </div>
        <div class="form-group">
            <label for="indication">Indication:</label>
            <select id="indication" name="indication">
                <option value="Pain">Pain</option>
                <option value="Virus">Virus</option>
                <option value="Infection">Infection</option>
                <option value="Wound">Wound</option>
                <option value="Pain">Pain</option>
                <option value="Fungus">Fungus</option>
                <option value="Depression">Depression</option>
                <option value="Diabetes">Diabetes</option>
            </select>
        </div>
        <div class="form-group">
            <label for="Classification">Classification:</label>
            <select id="classification" name="classification">
                <option value="Prescription">Prescription</option>
                <option value="Over-the-Counter">Over-the-Counter</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Add</button>
        <button type="submit" class="btn-submit">Cancel</button>
    </div>
    <div class="form-box-right">
        <div class="img-box"></div>
        <input type="file" id="image" name="image">
    </div>
</div>
</body>
</html>
