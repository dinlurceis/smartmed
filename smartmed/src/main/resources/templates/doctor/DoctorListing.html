<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header"></head>
<body>
    <nav th:replace="fragments/header :: navbar"></nav>

    <div class="container mt-4">
        <h2>Danh sách bác sĩ</h2>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-6">
                <form class="form-inline">
                    <input class="form-control mr-sm-2" type="search" placeholder="Tìm kiếm bác sĩ..." aria-label="Search">
                    <button class="btn btn-outline-primary my-2 my-sm-0" type="submit">Tìm kiếm</button>
                </form>
            </div>
            <div class="col-md-6">
                <select class="form-control" id="specialtyFilter">
                    <option value="">Tất cả chuyên khoa</option>
                    <option th:each="specialty : ${specialties}" 
                            th:value="${specialty.id}" 
                            th:text="${specialty.name}">Chuyên khoa</option>
                </select>
            </div>
        </div>

        <!-- Doctors List -->
        <div class="row">
            <div class="col-md-4 mb-4" th:each="doctor : ${doctors}">
                <div class="card h-100">
                    <img th:if="${doctor.imageUrl}" th:src="${doctor.imageUrl}" class="card-img-top" alt="Doctor Image">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${'BS. ' + doctor.name}">Tên bác sĩ</h5>
                        <p class="card-text">
                            <span class="badge badge-primary" th:text="${doctor.specialty}">Chuyên khoa</span>
                        </p>
                        <p class="card-text" th:text="${doctor.shortBio}">Giới thiệu ngắn về bác sĩ...</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{'/doctors/' + ${doctor.id}}" class="btn btn-primary">Xem chi tiết</a>
                            <a th:href="@{'/doctors/' + ${doctor.id} + '/booking'}" class="btn btn-success">Đặt lịch khám</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" th:if="${doctors.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${doctors.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/doctors(page=${doctors.number - 1})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, doctors.totalPages - 1)}"
                    th:classappend="${doctors.number == i} ? 'active'">
                    <a class="page-link" th:href="@{/doctors(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${doctors.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/doctors(page=${doctors.number + 1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
    <th:block th:replace="fragments/footer :: scripts"/>
</body>
</html>
